# Hybrid quantum baseline. Slower than C1/C2 — budget ~30-60 min on CPU.
# Use 8 qubits / 2 layers (paper-headline configuration).
experiment_id: baseline_C3_hybrid_breast
model:
  name: hybrid_qnn
  in_channels: 1
  num_classes: 2
  n_qubits: 8
  n_layers: 2
  noise_p: 0.0
  shots_per_inference: 1000
data:
  dataset: breastmnist
  batch_size: 16
  root: data/raw
training:
  epochs: 10
  lr: 5.0e-3
  class_weighting: true
  seed: [0, 1, 2]
noise_sweep: [0.0, 1.0e-3, 1.0e-2]
