# Pneumonia is much larger than breast — budget several hours on CPU
# (or run on GPU if available). Reduce epochs/seeds first if pressed for time.
experiment_id: baseline_C3_hybrid_pneumonia
model:
  name: hybrid_qnn
  in_channels: 1
  num_classes: 2
  n_qubits: 8
  n_layers: 2
  noise_p: 0.0
  shots_per_inference: 1000
data:
  dataset: pneumoniamnist
  batch_size: 32
  root: data/raw
training:
  epochs: 8
  lr: 5.0e-3
  class_weighting: true
  seed: [0, 1, 2]
noise_sweep: [0.0, 1.0e-3, 1.0e-2]
