experiment_id: fl_C2_compressed_breast_dirichlet05
model:
  name: classical_compressed
  in_channels: 1
  num_classes: 2
  hidden: [16, 8]
data:
  dataset: breastmnist
  batch_size: 32
  root: data/raw
fl:
  n_clients: 5
  rounds: 25
  local_epochs: 1
  partition: dirichlet
  dirichlet_alpha: 0.5
  strategy: fedavg
training:
  lr: 1.0e-3
  class_weighting: true
  seed: [0, 1, 2, 3, 4]   # bumped to 5 seeds for viable Wilcoxon power on the headline non-IID comparison
