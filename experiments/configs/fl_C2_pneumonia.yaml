experiment_id: fl_C2_compressed_pneumonia_iid
model:
  name: classical_compressed
  in_channels: 1
  num_classes: 2
  hidden: [16, 8]
data:
  dataset: pneumoniamnist
  batch_size: 64
  root: data/raw
fl:
  n_clients: 5
  rounds: 25
  local_epochs: 1
  partition: iid
  strategy: fedavg
training:
  lr: 1.0e-3
  class_weighting: true
  seed: [0, 1, 2]
