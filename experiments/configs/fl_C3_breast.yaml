# Hybrid quantum FL — slowest of the three. Budget several hours on CPU
# for 3 seeds × 25 rounds × 5 clients × 1 local epoch each.
# For first runs, drop seeds to [0] and rounds to 10 to verify behaviour.
experiment_id: fl_C3_hybrid_breast_iid
model:
  name: hybrid_qnn
  in_channels: 1
  num_classes: 2
  n_qubits: 8
  n_layers: 2
  noise_p: 0.0
  shots_per_inference: 1000
data:
  dataset: breastmnist
  batch_size: 16
  root: data/raw
fl:
  n_clients: 5
  rounds: 15
  local_epochs: 1
  partition: iid
  strategy: fedavg
training:
  lr: 5.0e-3
  class_weighting: true
  seed: [0, 1, 2]
