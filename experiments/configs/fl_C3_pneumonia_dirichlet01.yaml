experiment_id: fl_C3_hybrid_pneumonia_dirichlet01
model:
  name: hybrid_qnn
  in_channels: 1
  num_classes: 2
  n_qubits: 8
  n_layers: 2
  noise_p: 0.0
  shots_per_inference: 1000
data:
  dataset: pneumoniamnist
  batch_size: 32
  root: data/raw
fl:
  n_clients: 5
  rounds: 12
  local_epochs: 1
  partition: dirichlet
  dirichlet_alpha: 0.1
  strategy: fedavg
training:
  lr: 5.0e-3
  class_weighting: true
  seed: [0, 1, 2]
