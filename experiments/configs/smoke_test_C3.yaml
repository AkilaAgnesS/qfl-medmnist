experiment_id: smoke_C3_hybrid_breast
model:
  name: hybrid_qnn
  in_channels: 1
  num_classes: 2
  n_qubits: 4         # tiny for smoke test (paper headline uses 8)
  n_layers: 1         # tiny for smoke test (paper headline uses 2)
  noise_p: 0.0
  shots_per_inference: 1000
data:
  dataset: breastmnist
  batch_size: 16      # quantum forward pass is slower
  root: data/raw
training:
  epochs: 1           # one epoch is enough to verify the pipeline
  lr: 5.0e-3
  seed: [0]
noise_sweep: [0.0, 0.001]
